name: Generate complete course

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/generate-course.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-course]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generator syntax
        run: python -m py_compile tools/build_course.py tools/materialize_course.py
      - name: Generate 72 problem folders
        run: python tools/materialize_course.py
      - name: Validate generated structure
        run: |
          test "$(find . -name problem.md | wc -l)" -eq 72
          test "$(find . -name problem.py | wc -l)" -eq 72
          test "$(find . -name test_problem.py | wc -l)" -eq 72
          test "$(find . -name reference_solution.py | wc -l)" -eq 72
          python -m compileall -q _shared 0*_*/ 1*_*/
      - name: Commit generated curriculum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: materialize 72-problem curriculum [generated-course]"
            git push
          fi
